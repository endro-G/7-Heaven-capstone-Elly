<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-label="Pet blanket — Paw Stripes concept artwork">
  <defs>
    <g id="paw">
      <ellipse cx="0" cy="4" rx="9" ry="7" fill="#2f3a66"/>
      <circle cx="-10" cy="-8" r="3.6" fill="#2f3a66"/>
      <circle cx="-3" cy="-12" r="3.6" fill="#2f3a66"/>
      <circle cx="4" cy="-12" r="3.6" fill="#2f3a66"/>
      <circle cx="11" cy="-8" r="3.6" fill="#2f3a66"/>
    </g>
  </defs>
  <rect width="640" height="640" fill="#eef1f8"/>
  <ellipse cx="320" cy="540" rx="190" ry="24" fill="#2f3a66" opacity="0.07"/>
  <!-- folded blanket -->
  <rect x="140" y="150" width="360" height="360" rx="30" fill="#fbfaf6" stroke="#2f3a66" stroke-width="6"/>
  <path d="M140 210 L140 150 L200 150 Z" fill="#dbe1ef" stroke="#2f3a66" stroke-width="6" stroke-linejoin="round"/>
  <!-- navy stripes -->
  <rect x="140" y="168" width="360" height="34" fill="#2f3a66" rx="6"/>
  <rect x="140" y="458" width="360" height="34" fill="#2f3a66" rx="6"/>
  <!-- paw row -->
  <g transform="translate(196 292)">
    <use href="#paw" transform="translate(0 0) scale(1.6)"/>
    <use href="#paw" transform="translate(72 0) scale(1.6)"/>
    <use href="#paw" transform="translate(144 0) scale(1.6)"/>
    <use href="#paw" transform="translate(216 0) scale(1.6)"/>
    <use href="#paw" transform="translate(288 0) scale(1.6)"/>
  </g>
</svg>
