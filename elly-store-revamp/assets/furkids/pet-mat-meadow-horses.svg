      <circle cx="26" cy="18" r="3" fill="#f2efe7"/>
      <circle cx="41" cy="14" r="3" fill="#f2efe7"/>
    </g>
  </defs>
  <rect width="640" height="640" fill="#eef3ea"/>
  <ellipse cx="320" cy="548" rx="210" ry="22" fill="#5c7a5e" opacity="0.08"/>
